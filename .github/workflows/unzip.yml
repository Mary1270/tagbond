name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q tagbond.zip
          rsync -a --exclude .github tagbond/ ./
          rm -rf tagbond tagbond.zip
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add TagBond project"
          git push
